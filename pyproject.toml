[project]
name = "agibot-g2-mujoco"
version = "0.1.0"
description = "AgiBot G2 MuJoCo simulation viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.1",
    "jax-metal>=0.1.1",
    "mujoco>=3.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
