[project]
name = "agibot-g2-mujoco"
version = "0.1.0"
description = "AgiBot G2 MuJoCo simulation viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "jax-metal",
    "mujoco>=3.9.0",
    "lerobot[smolvla]",
    "torch",
    "torchvision",
    "pillow",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
