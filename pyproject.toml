[project]
name = "agibot-g2-mujoco"
version = "0.1.0"
description = "AgiBot G2 MuJoCo simulation viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "jax-metal; sys_platform == 'darwin'",
    "mujoco>=3.9.0; sys_platform == 'darwin'",
    "lerobot[smolvla]",
    "torch",
    "torchvision",
    "pillow",
    "scikit-learn",
]

[project.scripts]
smolvla = "smolvla_mujoco:launch"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["smolvla_mujoco.py"]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "sagemaker>=2.200.0",
    "boto3>=1.34.0",
]

[tool.ty.environment]
python = ".venv/bin/python"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
